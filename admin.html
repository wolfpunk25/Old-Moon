<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Old Moon — Admin</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
  <h1>Old Moon</h1>
  <a class="icon-link" href="index.html">Timeline</a>
</header>
<main>

  <section id="login-view" class="card" hidden>
    <h2>Log in</h2>
    <p class="hint">
      Paste a GitHub personal access token with read/write access to this repo only.
      Create one at
      <a class="icon-link" href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">github.com/settings/personal-access-tokens/new</a>
      — under "Repository access" choose "Old-Moon" only, and under "Permissions" grant
      Contents: Read and write.
    </p>
    <label for="token-input">Access token</label>
    <input type="password" id="token-input" autocomplete="off" placeholder="github_pat_...">
    <div class="actions">
      <button class="primary" id="login-btn">Save &amp; log in</button>
    </div>
    <div id="login-status" class="status"></div>
  </section>

  <section id="admin-view" hidden>
    <div class="card">
      <h2 id="form-title">New post</h2>
      <form id="post-form">
        <label for="image-input">Photo</label>
        <input type="file" id="image-input" accept="image/*">
        <div class="hint" id="exif-hint"></div>

        <label for="caption-input">Caption</label>
        <textarea id="caption-input" placeholder="What happened on this walk?"></textarea>

        <label for="tags-input">Tags (comma separated)</label>
        <input type="text" id="tags-input" placeholder="moorland, fog, sunrise">

        <label for="date-input">Captured</label>
        <input type="text" id="date-input" placeholder="YYYY-MM-DD HH:MM" inputmode="numeric">

        <label for="lat-input">Location (optional)</label>
        <div style="display:flex; gap:0.5rem;">
          <input type="text" id="lat-input" placeholder="Latitude" inputmode="decimal">
          <input type="text" id="lng-input" placeholder="Longitude" inputmode="decimal">
        </div>

        <div class="actions">
          <button type="submit" class="primary" id="submit-btn">Save post</button>
          <button type="button" id="cancel-edit-btn" hidden>Cancel edit</button>
        </div>
        <div id="form-status" class="status"></div>
      </form>
    </div>

    <div class="card">
      <h2>Posts</h2>
      <div id="admin-list"></div>
    </div>

    <button id="logout-btn">Log out</button>
  </section>

</main>
<script src="https://unpkg.com/exifr/dist/full.umd.js"></script>
<script type="module" src="js/admin.js"></script>
</body>
</html>
